<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7C4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6D4F" />
    </linearGradient>
    <!-- Dark Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1510" />
      <stop offset="100%" stop-color="#050403" />
    </radialGradient>
    <!-- Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8C6D4F" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGlow)" stroke="url(#borderGradient)" stroke-width="12" />

  <!-- Outer Tech Terminal Frame Accent -->
  <rect x="40" y="40" width="432" height="432" rx="72" fill="none" stroke="#D4AF37" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="16 12" />

  <!-- Symbolic TK Monogram -->
  <g fill="url(#goldGradient)" transform="translate(0, 0)">
    <!-- Letter T - Top Bar -->
    <path d="M 120 136 L 392 136 L 392 184 L 120 184 Z" />
    <!-- Letter T - Center Stem -->
    <path d="M 228 184 L 284 184 L 284 376 L 228 376 Z" />
    
    <!-- Letter K - Right Diagonal Upper Arm -->
    <path d="M 284 272 L 372 184 L 428 184 L 320 292 Z" />
    <!-- Letter K - Right Diagonal Lower Arm -->
    <path d="M 312 284 L 428 376 L 372 376 L 284 304 Z" />
  </g>

  <!-- Green Technical Status Dot -->
  <circle cx="412" cy="100" r="18" fill="#10B981" />
  <circle cx="412" cy="100" r="26" fill="none" stroke="#10B981" stroke-opacity="0.4" stroke-width="4" />
</svg>