<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luminous Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E782F" />
    </linearGradient>

    <!-- Warm Obsidian Background Gradient -->
    <radialGradient id="obsidianGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1C1814" />
      <stop offset="60%" stop-color="#0E0C0A" />
      <stop offset="100%" stop-color="#050403" />
    </radialGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8C6D4F" stop-opacity="0.2" />
    </linearGradient>
    
    <!-- Filter for subtle depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle with Warm Obsidian Tone -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#obsidianGrad)" stroke="url(#rimGrad)" stroke-width="14" />

  <!-- Inner Tech Edge -->
  <rect x="46" y="46" width="420" height="420" rx="90" fill="none" stroke="#D4AF37" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="14 10" />

  <!-- Bold Modern Editorial 'T' & Innovation Arrow Monogram (High Legibility at 16x16 & 32x32) -->
  <g filter="url(#glow)" fill="url(#goldGrad)">
    <!-- Top Horizontal Bar of 'T' -->
    <path d="M 116 140 C 116 131.16 123.16 124 132 124 L 380 124 C 388.84 124 396 131.16 396 140 L 396 188 C 396 196.84 388.84 204 380 204 L 288 204 L 288 368 C 288 376.84 280.84 384 272 384 L 240 384 C 231.16 384 224 376.84 224 368 L 224 204 L 132 204 C 123.16 204 116 196.84 116 188 Z" />

    <!-- Forward Chevron / Innovation Node (Integrated into Monogram) -->
    <path d="M 308 268 L 368 328 L 340 356 L 280 296 Z" fill="#FCE8A6" />
    <path d="M 308 348 L 368 288 L 392 312 L 332 372 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Emerald Active Node / Status Indicator -->
  <circle cx="414" cy="98" r="22" fill="#10B981" />
  <circle cx="414" cy="98" r="30" fill="none" stroke="#10B981" stroke-opacity="0.45" stroke-width="5" />
</svg>